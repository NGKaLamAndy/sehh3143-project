<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小島料理 – 訂單確認</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
</head>
<body class="bg-[#f9f9f9] font-sans">

  <div id="header-root"></div>

  <main class="max-w-xl mx-auto px-8 py-8">
    <div id="page-content"></div>
  </main>

<script>
document.getElementById('header-root').innerHTML = renderHeader();

function render() {
  const params  = new URLSearchParams(window.location.search);
  const orderId = params.get('id');
  const order   = orderId ? Store.getOrderById(orderId) : null;

  if (!order) {
    document.getElementById('page-content').innerHTML = `
      <div class="text-center py-20">
        <h2 class="text-2xl font-bold mb-4">找不到訂單</h2>
        <a href="menu.html" class="text-blue-600 hover:underline">返回菜單</a>
      </div>`;
    return;
  }

  const hasDeliveryFee = order.deliveryFee && order.deliveryFee > 0;
  const subtotal = order.subtotal || (order.totalAmount - (order.deliveryFee || 0));

  document.getElementById('page-content').innerHTML = `
    <div class="space-y-6">

      <!-- Success card -->
      <div class="bg-white p-10 rounded-3xl shadow-sm border border-gray-100 text-center">
        <div class="w-20 h-20 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-6">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        </div>
        <h1 class="text-3xl font-bold mb-2">訂單已提交！</h1>
        <p class="text-gray-500 mb-8">訂單編號: ${order.id}</p>
        <div class="inline-block bg-blue-50 text-blue-600 px-4 py-1.5 rounded-full text-sm font-medium mb-8">已下單</div>

        <div class="space-y-4 text-left border-t border-gray-100 pt-8">
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">取餐方式</span>
            <span class="font-medium">${order.deliveryMethod === 'pickup' ? '自取' : '外送'}</span>
          </div>
          ${order.deliveryAddress ? `
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">送貨地址</span>
            <span class="font-medium text-right max-w-[200px]">${htmlEscape(order.deliveryAddress)}</span>
          </div>` : ''}
          ${order.deliveryZoneName ? `
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">配送區域</span>
            <span class="font-medium">${htmlEscape(order.deliveryZoneName)}</span>
          </div>` : ''}
          ${order.deliveryDistance != null ? `
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">距離</span>
            <span class="font-medium">約 ${order.deliveryDistance}km</span>
          </div>` : ''}
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">${order.deliveryMethod === 'pickup' ? '取餐時間' : '預計送達'}</span>
            <span class="font-medium">${htmlEscape(order.pickupTime)}</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">付款</span>
            <span class="font-medium">${order.paymentMethod === 'cash' ? '現金' : '線上付款'}</span>
          </div>
          <div class="border-t border-gray-100 pt-4 space-y-2">
            <div class="flex justify-between text-sm">
              <span class="text-gray-500">小計</span>
              <span>$${subtotal}</span>
            </div>
            ${hasDeliveryFee ? `
            <div class="flex justify-between text-sm">
              <span class="text-gray-500">外送費</span>
              <span>$${order.deliveryFee}</span>
            </div>` : ''}
            <div class="flex justify-between text-sm font-bold pt-2 border-t border-gray-50">
              <span>合計</span>
              <span>$${order.totalAmount}</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Items list -->
      <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
        <h2 class="font-bold mb-6">餐點</h2>
        <div class="space-y-4">
          ${order.items.map(item => `
            <div class="flex justify-between text-sm">
              <div>
                <span class="font-medium">${htmlEscape(item.menuItem.name)} × ${item.quantity}</span>
                ${Object.entries(item.selectedCustomizations || {}).map(([cId, chId]) => {
                  const cust   = (item.menuItem.customizations||[]).find(c => c.id === cId);
                  const choice = (cust ? cust.choices : []).find(c => c.id === chId);
                  return cust && choice ? `<div class="text-gray-500 text-xs mt-1">${htmlEscape(cust.name)}: ${htmlEscape(choice.name)}</div>` : '';
                }).join('')}
                ${item.specialInstructions ? `<div class="text-orange-600 text-xs mt-1 font-medium">備註: ${htmlEscape(item.specialInstructions)}</div>` : ''}
              </div>
              <span class="font-medium">$${item.totalPrice}</span>
            </div>`).join('')}
        </div>
      </div>

      <!-- Reminder -->
      <div class="bg-orange-50 text-orange-800 p-4 rounded-xl text-center text-sm font-medium">
        ${order.deliveryMethod === 'pickup' ? '請留意取餐時間，我們會盡快為您準備！' : '外送員會盡快為您送達，請留意電話。'}
      </div>

      <!-- Actions -->
      <div class="flex gap-4">
        <a href="menu.html"
           class="w-full bg-[#2a2828] text-white py-4 rounded-xl font-medium text-center hover:bg-black transition-colors no-underline">
          返回菜單
        </a>
        <a href="order-tracking.html?id=${order.id}"
           class="w-full bg-white border border-gray-200 text-gray-700 py-4 rounded-xl font-medium text-center hover:bg-gray-50 transition-colors no-underline">
          查看訂單狀態
        </a>
      </div>

    </div>`;
}

render();
</script>
</body>
</html>
